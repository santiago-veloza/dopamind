openapi: 3.0.3
info:
  title: DopamiND — Journal Service
  description: Entradas de diario del usuario. Puerto 3003.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: API Gateway
paths:
  /journal-entries:
    get:
      summary: Listar entradas del diario (más recientes primero)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Lista de entradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal_entries:
                    type: array
                    items: { $ref: "#/components/schemas/JournalEntry" }
        "401": { description: Token requerido }
    post:
      summary: Crear una entrada
      description: Publica el evento `journal.created` (vía outbox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                prompt: { type: string, nullable: true }
                mood:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                  description: "1=Muy mal, 2=Mal, 3=Regular, 4=Bien, 5=Muy bien"
      responses:
        "201":
          description: Entrada creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal_entry: { $ref: "#/components/schemas/JournalEntry" }
        "400": { description: Contenido vacío (máx. 10000) o mood no entero entre 1 y 5 }
  /journal-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Obtener una entrada
      responses:
        "200": { description: Entrada encontrada }
        "404": { description: No encontrada }
    delete:
      summary: Eliminar una entrada
      responses:
        "200": { description: Eliminada }
        "404": { description: No encontrada }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    JournalEntry:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        content: { type: string }
        prompt: { type: string, nullable: true }
        mood: { type: integer, minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }
security:
  - bearerAuth: []
